<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linkfolio Overall Use-Case Diagrams</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #17212b; background: #f3f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 18px 56px; }
    main { max-width: 1240px; margin: 0 auto; }
    h1 { margin: 0 0 8px; text-align: center; font-size: 30px; }
    .intro { margin: 0 auto 28px; max-width: 760px; color: #536170; text-align: center; line-height: 1.5; }
    figure { margin: 24px 0 36px; padding: 20px; overflow-x: auto; background: #fff; border: 1px solid #d8e0e7; border-radius: 12px; box-shadow: 0 5px 18px #1c2b3a0d; }
    figcaption { margin: 0 0 14px; font-size: 21px; font-weight: 700; }
    svg { display: block; width: 100%; min-width: 900px; height: auto; }
    .boundary { fill: #fbfdff; stroke: #40566b; stroke-width: 2.2; }
    .boundary-title { fill: #263f56; font-size: 19px; font-weight: 700; }
    .usecase { fill: #fff; stroke: #49647d; stroke-width: 1.7; }
    .uc-label { fill: #17212b; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    .actor { stroke: #23384a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .actor-label { fill: #17212b; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .association { stroke: #687b8c; stroke-width: 1.4; fill: none; }
    .relationship { stroke: #8191a0; stroke-width: 1.3; fill: none; stroke-dasharray: 5 5; }
    .note { fill: #627282; font-size: 12px; }
    @media print {
      :root { background: #fff; }
      body { padding: 0; }
      figure { break-inside: avoid; box-shadow: none; border-color: #aaa; margin: 0 0 18px; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
<main>
  <h1>Linkfolio Overall Use-Case Diagrams</h1>
  <p class="intro">Two separate overview diagrams, aligned with the project’s implemented user and administrator functions.</p>

  <figure>
    <figcaption>Overall Use-Case Diagram for User</figcaption>
    <svg viewBox="0 0 1200 760" role="img" aria-label="Linkfolio overall user use-case diagram">
      <rect class="boundary" x="170" y="42" width="850" height="670" rx="4" />
      <text class="boundary-title" x="595" y="72" text-anchor="middle">Linkfolio System</text>

      <!-- Actors -->
      <g class="actor" transform="translate(85 340)">
        <circle cx="0" cy="-35" r="13"/><path d="M0 -22v45M-23 -7h46M0 23l-19 28M0 23l19 28"/>
      </g>
      <text class="actor-label" x="85" y="410">User</text>
      <g class="actor" transform="translate(1110 500)">
        <circle cx="0" cy="-35" r="13"/><path d="M0 -22v45M-23 -7h46M0 23l-19 28M0 23l19 28"/>
      </g>
      <text class="actor-label" x="1110" y="570">Visitor</text>
      <g class="actor" transform="translate(1110 190)">
        <circle cx="0" cy="-35" r="13"/><path d="M0 -22v45M-23 -7h46M0 23l-19 28M0 23l19 28"/>
      </g>
      <text class="actor-label" x="1110" y="260">Payment Gateway</text>

      <!-- User associations -->
      <path class="association" d="M108 333L245 132 M108 336L430 132 M108 339L615 132 M108 342L800 132 M108 345L245 230 M108 348L430 230 M108 351L615 230 M108 354L800 230 M108 357L245 330 M108 360L430 330 M108 363L615 330 M108 366L800 330 M108 369L245 430 M108 372L430 430 M108 375L615 430 M108 378L800 430"/>
      <!-- Visitor associations -->
      <path class="association" d="M1090 495L800 535 M1090 500L615 535 M1090 505L430 535"/>
      <!-- Payment association -->
      <path class="association" d="M1090 190L800 630"/>

      <!-- User use cases -->
      <ellipse class="usecase" cx="300" cy="132" rx="100" ry="34"/><text class="uc-label" x="300" y="132">Register</text>
      <ellipse class="usecase" cx="485" cy="132" rx="100" ry="34"/><text class="uc-label" x="485" y="132">Log in / log out</text>
      <ellipse class="usecase" cx="670" cy="132" rx="100" ry="34"/><text class="uc-label" x="670" y="132">Recover / change password</text>
      <ellipse class="usecase" cx="855" cy="132" rx="100" ry="34"/><text class="uc-label" x="855" y="132">Manage account</text>

      <ellipse class="usecase" cx="300" cy="230" rx="100" ry="34"/><text class="uc-label" x="300" y="230">Manage resumes</text>
      <ellipse class="usecase" cx="485" cy="230" rx="100" ry="34"/><text class="uc-label" x="485" y="230">Import existing resume</text>
      <ellipse class="usecase" cx="670" cy="230" rx="100" ry="34"/><text class="uc-label" x="670" y="230">Preview / export resume</text>
      <ellipse class="usecase" cx="855" cy="230" rx="100" ry="34"/><text class="uc-label" x="855" y="230">Manage profile and links</text>

      <ellipse class="usecase" cx="300" cy="330" rx="100" ry="34"/><text class="uc-label" x="300" y="330">Manage portfolios</text>
      <ellipse class="usecase" cx="485" cy="330" rx="100" ry="34"/><text class="uc-label" x="485" y="330">Customize portfolio</text>
      <ellipse class="usecase" cx="670" cy="330" rx="100" ry="34"/><text class="uc-label" x="670" y="330">Publish / set visibility</text>
      <ellipse class="usecase" cx="855" cy="330" rx="100" ry="34"/><text class="uc-label" x="855" y="330">View analytics</text>

      <ellipse class="usecase" cx="300" cy="430" rx="100" ry="34"/><text class="uc-label" x="300" y="430">Manage received messages</text>
      <ellipse class="usecase" cx="485" cy="430" rx="100" ry="34"/><text class="uc-label" x="485" y="430">Upgrade to Premium</text>

      <ellipse class="usecase" cx="855" cy="535" rx="100" ry="34"/><text class="uc-label" x="855" y="535">View public portfolio</text>
      <ellipse class="usecase" cx="670" cy="535" rx="100" ry="34"/><text class="uc-label" x="670" y="535">Open portfolio links</text>
      <ellipse class="usecase" cx="485" cy="535" rx="100" ry="34"/><text class="uc-label" x="485" y="535">Submit contact message</text>
      <ellipse class="usecase" cx="855" cy="630" rx="100" ry="34"/><text class="uc-label" x="855" y="630">Process payment</text>

      <path class="relationship" d="M585 430L760 615"/><text class="note" x="660" y="510">payment for upgrade</text>
      <path class="relationship" d="M770 535L585 535"/><text class="note" x="676" y="522">optional portfolio actions</text>
    </svg>
  </figure>

  <figure>
    <figcaption>Overall Use-Case Diagram for Admin</figcaption>
    <svg viewBox="0 0 1200 650" role="img" aria-label="Linkfolio overall administrator use-case diagram">
      <rect class="boundary" x="170" y="42" width="850" height="560" rx="4" />
      <text class="boundary-title" x="595" y="72" text-anchor="middle">Linkfolio System</text>

      <g class="actor" transform="translate(85 320)">
        <circle cx="0" cy="-35" r="13"/><path d="M0 -22v45M-23 -7h46M0 23l-19 28M0 23l19 28"/>
      </g>
      <text class="actor-label" x="85" y="390">Administrator</text>

      <path class="association" d="M108 310L300 145 M108 316L510 145 M108 322L720 145 M108 328L900 145 M108 334L300 300 M108 340L510 300 M108 346L720 300 M108 352L900 300 M108 358L510 460"/>

      <ellipse class="usecase" cx="380" cy="145" rx="115" ry="38"/><text class="uc-label" x="380" y="145">Log in / log out</text>
      <ellipse class="usecase" cx="610" cy="145" rx="115" ry="38"/><text class="uc-label" x="610" y="145">Manage user accounts</text>
      <ellipse class="usecase" cx="820" cy="145" rx="115" ry="38"/><text class="uc-label" x="820" y="145">Manage templates</text>

      <ellipse class="usecase" cx="380" cy="300" rx="115" ry="38"/><text class="uc-label" x="380" y="300">View user list</text>
      <ellipse class="usecase" cx="610" cy="300" rx="115" ry="38"/><text class="uc-label" x="610" y="300">Enable / disable user</text>
      <ellipse class="usecase" cx="820" cy="300" rx="115" ry="38"/><text class="uc-label" x="820" y="300">Delete user</text>

      <ellipse class="usecase" cx="380" cy="460" rx="115" ry="38"/><text class="uc-label" x="380" y="460">Edit template settings</text>
      <ellipse class="usecase" cx="610" cy="460" rx="115" ry="38"/><text class="uc-label" x="610" y="460">Manage subscription plans</text>
      <ellipse class="usecase" cx="840" cy="460" rx="115" ry="38"/><text class="uc-label" x="840" y="460">View platform reports</text>

      <path class="relationship" d="M705 175L442 425"/><text class="note" x="518" y="328">includes editing name, availability, Premium access</text>
      <path class="relationship" d="M725 145L610 422"/><text class="note" x="655" y="355">update plan limits / availability</text>
    </svg>
  </figure>
</main>
</body>
</html>
